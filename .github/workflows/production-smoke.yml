name: Production clean-host smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.production.example'
      - '.github/workflows/production-smoke.yml'
      - 'infra/production/**'
      - 'infra/workspace-images/node/**'
      - 'scripts/production-clean-host-smoke.sh'

permissions:
  contents: read
  packages: read

jobs:
  clean-host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_SMOKE_ALLOW: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run production smoke on a clean Linux host
        run: bash scripts/production-clean-host-smoke.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-clean-host-evidence
          path: ${{ runner.temp }}/odc-smoke-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the disposable stack
        if: always()
        run: |
          docker compose --project-name "odc-clean-host-${GITHUB_RUN_ID}" \
            --env-file .env.production \
            -f infra/production/docker-compose.prod.yml \
            down -v --remove-orphans || true
