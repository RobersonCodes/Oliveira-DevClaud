name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Real database — the database package's integration tests (packages/database/src/index.test.ts)
      # run real Prisma queries, not mocks, against this service container.
      DATABASE_URL: postgresql://oliveira:oliveira@localhost:5432/devcloud?schema=public
      REDIS_URL: redis://localhost:6379
      # Real workspace containers (workspace-engine/git-engine tests, and the minimal E2E journey)
      # bind-mount this path from the host; the runner's default WORKSPACE_ROOT isn't writable.
      WORKSPACE_ROOT: /tmp/odc-workspaces
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oliveira
          POSTGRES_PASSWORD: oliveira
          POSTGRES_DB: devcloud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oliveira -d devcloud"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate:deploy
      # The E2E test (apps/api/src/e2e.test.ts) starts a real workspace container from this image —
      # not a lightweight stand-in — to exercise the actual login -> project -> workspace ->
      # terminal -> run a command -> stop journey end to end.
      - name: Build workspace image
        run: docker build -t oliveira-devcloud/workspace-node:1.1.0 infra/workspace-images/node
      - name: Verify workspace image tools and non-root user
        run: |
          docker run --rm oliveira-devcloud/workspace-node:1.1.0 sh -lc 'test "$(id -u)" = 10001 && code-server --version | grep -E "^4\\.121\\.0( |$)" && pnpm --version | grep -Fx 11.21.0 && codex --version | grep -Fx "codex-cli 0.147.0" && claude --version | grep -Fx "2.1.226 (Claude Code)"'
      - name: Lint
        run: npm run lint
      # `npm run typecheck --workspaces` executes each workspace independently and does not
      # respect the internal @oliveira/* dependency graph, so a package's .d.ts output may not
      # exist yet when a downstream workspace is type-checked. Two best-effort build passes
      # populate every internal package's dist/ (order-independent, since the dependency graph
      # here is at most two levels deep) before the real, failing-typecheck gate runs.
      - name: Prepare internal package type declarations
        run: |
          npm run build --workspaces --if-present || true
          npm run build --workspaces --if-present || true
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
