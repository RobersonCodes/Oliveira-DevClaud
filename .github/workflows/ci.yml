name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # prisma generate/validate require DATABASE_URL to be a well-formed connection string, but
      # none of the CI steps (generate/typecheck/test/build) open a real connection.
      DATABASE_URL: postgresql://oliveira:oliveira@localhost:5432/devcloud?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      # `npm run typecheck --workspaces` executes each workspace independently and does not
      # respect the internal @oliveira/* dependency graph, so a package's .d.ts output may not
      # exist yet when a downstream workspace is type-checked. Two best-effort build passes
      # populate every internal package's dist/ (order-independent, since the dependency graph
      # here is at most two levels deep) before the real, failing-typecheck gate runs.
      - name: Prepare internal package type declarations
        run: |
          npm run build --workspaces --if-present || true
          npm run build --workspaces --if-present || true
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
