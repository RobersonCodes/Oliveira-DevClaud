name: Publish workspace image

on:
  push:
    branches: [main]
    tags: ['workspace-node-v*']
    paths:
      - 'infra/workspace-images/node/**'
      - '.github/workflows/workspace-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/robersoncodes/oliveira-devcloud-workspace-node

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=edge,enable={{is_default_branch}}
            type=match,pattern=workspace-node-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/workspace-node-v') }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/workspace-images/node
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
