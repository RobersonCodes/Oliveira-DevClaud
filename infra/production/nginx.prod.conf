map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Shared HTTP -> HTTPS redirect for both origins. Same redirect logic either way, so one server
# block listing both server_names avoids duplicating it.
server {
  listen 80;
  server_name ${DEV_CLOUD_HOST} *.${RUNTIME_BASE_DOMAIN};
  return 301 https://$host$request_uri;
}

# --- Control plane (panel): ${DEV_CLOUD_HOST} ---
server {
  listen 443 ssl;
  http2 on;
  server_name ${DEV_CLOUD_HOST};
  ssl_certificate /etc/nginx/certs/panel/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/panel/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 25m;
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# --- Runtime Gateway (IDE/preview, origin-isolated from the panel): *.${RUNTIME_BASE_DOMAIN} ---
# Every workspace gets its own subdomain here (ide-<id>.<base>, preview-<id>-<port>.<base> — see
# apps/api/src/lib/runtimeGateway.ts's parseRuntimeHost/runtimeHostPattern). All of them route to
# the SAME api:4000 backend; Fastify itself dispatches by the (unmodified) Host header via route
# constraints, so nginx's only job here is TLS termination — it must never rewrite, strip, or
# default the Host header, and must never route this server_name to the `web` service. CSP,
# Referrer-Policy, Permissions-Policy and X-Content-Type-Options for this origin are already set
# authoritatively by the app itself (see runtimeSecurityHeaders() in runtimeGateway.ts, applied to
# every response including ones proxied from inside the workspace container) — only HSTS, which the
# app does not set, is added here.
server {
  listen 443 ssl;
  http2 on;
  server_name *.${RUNTIME_BASE_DOMAIN};
  ssl_certificate /etc/nginx/certs/runtime/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/runtime/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 25m;
  location / {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
