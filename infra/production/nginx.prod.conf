map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80; server_name ${DEV_CLOUD_HOST};
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2; server_name ${DEV_CLOUD_HOST};
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 25m;
  location /api/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location /runtime/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_buffering off; }
  location / { proxy_pass http://web:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
