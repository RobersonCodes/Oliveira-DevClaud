services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oliveira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devcloud}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oliveira}"], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis_data:/data]
  api:
    build: { context: ../.., dockerfile: infra/production/Dockerfile.api }
    restart: unless-stopped
    env_file: ../../.env.production
    depends_on: [postgres,redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace_data:/var/lib/oliveira-devcloud/workspaces
  worker:
    build: { context: ../.., dockerfile: infra/production/Dockerfile.worker }
    restart: unless-stopped
    env_file: ../../.env.production
    depends_on: [postgres,redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace_data:/var/lib/oliveira-devcloud/workspaces
  web:
    build: { context: ../.., dockerfile: infra/production/Dockerfile.web }
    restart: unless-stopped
    env_file: ../../.env.production
    depends_on: [api]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [web,api]
volumes: { postgres_data: {}, redis_data: {}, workspace_data: {} }
